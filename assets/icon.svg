    <linearGradient id="drape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d1820"/><stop offset=".3" stop-color="#c8333b"/><stop offset=".55" stop-color="#8f1d25"/>
      <stop offset=".8" stop-color="#d23c44"/><stop offset="1" stop-color="#7d1820"/>
    </linearGradient>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="#17181b"/>
    <path d="M100 100 H466 C438 390 374 630 318 924 H100 Z" fill="url(#drape)"/>
