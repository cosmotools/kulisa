<!doctype html>
<html lang="en" aria-busy="true">
<head>
  <meta charset="utf-8">
  <title>Kulisa</title>
  <!-- The theme (dark, light, system: tokens.css) and where the tasks' bar is (top, bottom) come in the URL, set
       before the first paint (window.ts, load) -->
  <script>{ const q = new URLSearchParams(location.search), root = document.documentElement;
    root.dataset.theme = q.get('theme') || 'dark'; root.dataset.bar = q.get('bar') || 'bottom'; }</script>
  <script type="module" src="./main.ts"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
