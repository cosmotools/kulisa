<!doctype html>
<!-- The window of a profile's master (main/master.ts, components/Master.tsx): a bar over its page, where the human signs
     in once for every task. The page itself is a native view under the bar. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Styles inline too: Fluent UI's (Griffel) are style elements it makes as it renders -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Sign in</title>
  <script type="module" src="./master.tsx"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
