<!doctype html>
<!-- Settings' window (main/settings-window.ts, components/Settings.vue). Its theme comes in the URL, set before the first
     paint. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Settings — Kulisa</title>
  <script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'dark';</script>
  <script type="module" src="./settings.ts"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
