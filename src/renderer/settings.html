<!doctype html>
<!-- Settings' window (main/settings-window.ts, components/settings/Settings.vue). Its theme comes in the URL, set before the first
     paint (lib/theme.ts). -->
<html lang="en" class="h-full overflow-hidden">
<head>
  <meta charset="utf-8">
  <title>Settings — Kulisa</title>
  <script>{ const t = new URLSearchParams(location.search).get('theme') || 'dark', root = document.documentElement;
    root.dataset.theme = t;
    root.classList.toggle('dark', t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)); }</script>
  <script type="module" src="./settings.ts"></script>
</head>
<!-- The window is its page, the nav and the chosen page each scrolling on their own (ProjectEditor.vue). A desktop app:
     labels and buttons are not text to select; fields are. -->
<body class="flex h-full cursor-default overflow-clip text-sm select-none">
  <div id="app" class="contents"></div>
</body>
</html>
