<!-- What a profile's tab shows when its page did not load, as Chrome's error page: Electron leaves it blank
     (profiles.js, showError). Filled in by data-* fields; the address stays the one that failed. -->
<head>
  <meta name="color-scheme" content="light dark">
  <title data-field="host"></title>
  <style>
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: light-dark(#202124, #e8eaed); background: light-dark(#fff, #202124); }
    main { max-width: 560px; margin: 14vh auto 0; padding: 0 24px; }
    svg { width: 72px; height: 72px; color: light-dark(#5f6368, #9aa0a6); }
    h1 { margin: 24px 0 12px; font-size: 24px; font-weight: 500; }
    p { margin: 0 0 8px; color: light-dark(#5f6368, #9aa0a6); }
    code { font-size: 12px; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <path d="M4 5h16v12H4zM8 21h8M12 17v4M9 9l6 4M15 9l-6 4"/>
    </svg>
    <h1 data-field="title"></h1>
    <p data-field="reason"></p>
    <p><code data-field="code"></code></p>
  </main>
</body>
