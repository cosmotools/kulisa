# Dependabot's updates: into develop, where work goes (CLAUDE.md, Releases), never straight into main. Once a week,
# minor and patch updates in one pull request per ecosystem; a major one a pull request of its own (it may need code).
# Security updates go into the repository's default branch, develop, all of them in one pull request too: a group
# applies to version updates only unless it says otherwise. Only what package.json names (`allow`, for security updates
# too), not what its dependencies pull in (the author's choice).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    allow:
      - dependency-type: direct
    groups:
      npm:
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
