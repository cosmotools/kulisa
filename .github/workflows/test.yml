# npm test on every pull request into develop or main and every push to develop, on each OS Kulisa targets
# (docs/testing.md, CI). Linux as on the author's machine: Ubuntu, Xvfb and openbox. A pull request into main also
# needs its version raised: a merge into main is a release (CLAUDE.md, Releases).
name: test
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # main's version and the pull request's: higher, or the same while that one was never released (the first release).
  version:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git fetch --depth=1 origin "$GITHUB_BASE_REF"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(git show FETCH_HEAD:package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          head=$(node -p "require('./package.json').version")
          if node -e 'const [a, b] = process.argv.slice(1).map(v => v.split(".").map(Number));
            const i = a.findIndex((x, j) => x !== b[j]); process.exit(i >= 0 && a[i] > b[i] ? 0 : 1)' "$head" "$base"
          then echo "$base → $head"; exit 0; fi
          if [ "$head" = "$base" ] && ! gh release view "v$base" >/dev/null 2>&1; then echo "$head: not released yet"; exit 0; fi
          echo "::error::The version is $head, not above main's ($base): raise it (CLAUDE.md, Releases)"; exit 1
  # The pull request's new dependencies (the lockfile's diff against its base, by GitHub's dependency graph): none with a
  # known vulnerability, and each under a license that may be part of a GPL-3.0 program (docs/LICENSING.md, which
  # keeps this list; one not on it is a conversation, not a fix). One it cannot tell is reported, not refused.
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          allow-licenses: >-
            GPL-3.0-or-later, GPL-3.0-only, GPL-2.0-or-later, LGPL-2.1-or-later, LGPL-3.0-or-later, MIT, ISC, 0BSD,
            BSD-2-Clause, BSD-3-Clause, Apache-2.0, MPL-2.0, BlueOak-1.0.0, Unlicense, CC0-1.0, Zlib, BSL-1.0,
            Python-2.0, OFL-1.1
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Windows is not passing yet (ROADMAP, "macOS and Windows are untested"): its runs report, but do not mark main red.
    # It comes off this once its first run passes, as macOS did (2026-10-16).
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    # Windows's run hangs (2026-10-18): cut at 15 minutes, three times what Ubuntu and macOS take, so it is reported
    # sooner than at the 30 of the others.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 15 || 30 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # The test folders in one known place on every OS (os.tmpdir() reads these), for the artifact below. Through
      # GITHUB_ENV: the job's env cannot read the runner context (GitHub refused the whole file).
      - run: printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # gnome-keyring and D-Bus: a keyring, as a desktop has, or safeStorage encrypts nothing and Kulisa keeps no
      # session cookies and no test password (they are never written in the clear).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox gnome-keyring dbus-x11 libsecret-1-0
      - run: npm ci
      # The macOS runner's screen is 1024×768, smaller than a laptop's: the tests' windows did not fit as they lay them
      # out (2026-10-16). Its virtual screen has 1920×1080, as Linux's Xvfb (displayplacer, MIT: the runner's only).
      - if: runner.os == 'macOS'
        run: |
          brew tap jakehilborn/jakehilborn && brew install displayplacer
          displayplacer "id:$(displayplacer list | awk '/^Persistent screen id:/ { print $4; exit }') res:1920x1080"
          displayplacer list | grep -m1 '^Resolution:'
      # Tasks commit in their test repositories (worktrees.ts): git needs a name.
      - run: git config --global user.name "Kulisa tests" && git config --global user.email "tests@kulisa.app"
      - if: runner.os != 'Linux'
        run: npm test
      # On Linux in a D-Bus session with a keyring made and unlocked: its password is any but empty (an empty one makes
      # none, and libsecret then waits on a prompt nobody answers); the runner is thrown away after. Chromium takes
      # the keyring by the desktop's name, and a desktop it does not know gets none (basic_text: nothing encrypted).
      - if: runner.os == 'Linux'
        env:
          XDG_CURRENT_DESKTOP: GNOME
        run: dbus-run-session -- sh -c 'echo ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && npm test'
      # A failed group keeps its folder, its screenshots in it (docs/testing.md); a week, then GitHub removes it.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-folders-${{ matrix.os }}
          path: ${{ runner.temp }}/kulisa-test-*
          retention-days: 7
