# A merge into main (a pull request from develop, its version raised: test.yml's version job): the installers built on
# each OS and uploaded to one draft release, which the author publishes (CLAUDE.md, Releases; docs/window.md, "The app
# icon, installers and updates"). macOS joins once the Apple secrets are set.
name: release
on:
  push:
    branches: [main]
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  # The draft made here, not by Forge: Forge's names no commit, and GitHub would tag whatever main is when it is
  # published. Forge then finds it by its tag's name and uploads into it.
  draft:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # A version released before (a merge with its number not raised) would upload over that release's installers.
      # Its notes are the merged pull request's text: what is new for the user (CLAUDE.md, Releases).
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG is released already: raise the version in package.json (CLAUDE.md, Releases)"; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].body // ""' > notes.md
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
  build:
    needs: draft
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
